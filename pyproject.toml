[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaste-sbml"
dynamic = ["version"]

description = "Chaste C++ code generation from SBML"

readme = "README.md"
license = { file = "LICENSE" }

authors = [
  { name = "Kwabena Amponsah" },
  { name = "James Osborne" },
  { name = "Chaste Developers", email = "chaste-users@maillist.ox.ac.uk" }
]

requires-python = ">=3.10"

keywords = ["SBML", "Chaste", "code generation", "C++", "systems biology"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Software Development :: Code Generators",
]

dependencies = ["clang-format", "Jinja2 >=3.0,<4", "python-libsbml >=5.20,<6"]

[project.optional-dependencies]
dev = [
  "black",
  "flake8",
  "flake8-bugbear",
  "isort",
  "pytest",
  "pytest-cov",
]
docs = [
  "sphinx",
  "sphinx-autobuild",
  "sphinx-copybutton",
  "furo",
  "myst-parser",
]

[project.scripts]
chaste-sbml = "chaste_sbml.__main__:main"

[project.urls]
source = "https://github.com/Chaste/chaste-codegen-sbml"
documentation = "https://chaste.github.io/chaste-codegen-sbml/"
issues = "https://github.com/Chaste/chaste-codegen-sbml/issues"

[tool.setuptools.package-data]
# Ship the C++ base classes so `chaste-sbml --copy-base-classes` can copy them
# out of an installed package (setuptools-scm also tracks these, but declaring
# them explicitly keeps them in the wheel regardless of the VCS file finder.)
chaste_sbml = [
    "SbmlRefModels/src/*.hpp",
    "SbmlRefModels/src/*.cpp",
    "SbmlRefModels/src/fortests/*.hpp",
    "SbmlRefModels/src/fortests/*.cpp",
]

[tool.setuptools_scm]
version_file = "chaste_sbml/_version.py"

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = """
(
  templates/
  | ^/venv/
)
"""

[tool.isort]
known_first_party = "chaste_sbml"
extend_skip = ["templates", "venv"]
profile = "black"
line_length = 120
