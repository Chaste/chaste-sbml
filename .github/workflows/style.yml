name: style
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flake8

      - name: Lint
        run: |
          python3 -m flake8 --version
          python3 -m flake8
