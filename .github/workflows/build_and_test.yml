name: build_and_test

on: [pull_request]

concurrency:
  group: build_and_test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install .[dev]

      - name: Run Python tests
        run: |
          python3 -m pytest --cov --cov-config=.coveragerc --cov-report=term --cov-report=xml

      - name: Upload Python ${{ matrix.python-version }} coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-${{ matrix.python-version }}-coverage
          path: coverage.xml

  cpp_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Chaste
        uses: actions/checkout@v4
        with:
          repository: Chaste/Chaste
          path: Chaste

      - name: Setup Chaste paths
        run: |
          ln -s $(pwd)/chaste_codegen_sbml/SBMLRefModels Chaste/projects/SBMLRefModels
          mkdir -p Chaste/build

      - name: Install Chaste dependencies
        run: |
          sudo wget -O /usr/share/keyrings/chaste.asc https://chaste.github.io/chaste.asc
          codename="$(. /etc/os-release && echo ${VERSION_CODENAME} | sed 's/\.//')"
          repo="deb [signed-by=/usr/share/keyrings/chaste.asc] https://chaste.github.io/ubuntu ${codename}/"
          echo "${repo}" | sudo tee /etc/apt/sources.list.d/chaste.list
          sudo apt-get update
          sudo apt-get install -y chaste-dependencies lcov

      - name: Configure Chaste
        run: |
          cmake -DCMAKE_BUILD_TYPE=Debug -DChaste_ERROR_ON_WARNING=OFF -DChaste_COVERAGE=ON ..
        working-directory: Chaste/build

      - name: Build SBMLRefModels
        run: |
          cmake --build . --target project_SBMLRefModels --parallel $(nproc)
        working-directory: Chaste/build

      - name: Test SBMLRefModels
        run: |
          ctest -j $(nproc) -L SBMLRefModels --output-on-failure
        working-directory: Chaste/build

      - name: Run coverage
        run: |
          lcov --capture --no-external \
            --directory build/projects/SBMLRefModels \
            --base-directory projects/SBMLRefModels/src \
            --output-file coverage.info
          lcov --remove coverage.info '*/test/*' --output-file coverage.info
          lcov --list coverage.info
        working-directory: Chaste

      - name: Upload C++ coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage
          path: Chaste/coverage.info

  upload_to_codecov:
    needs: [python_tests, cpp_tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
